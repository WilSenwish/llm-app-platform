server:
  port: 8080

llm:
  gateway:
    api-key: ${LLM_GATEWAY_API_KEY:}
    global-permits-per-second: 20
    user-permits-per-second: 5
    max-attempts: 2
    model-timeout: 3s
    endpoints: []
    # 示例（不要把密钥写进仓库）：
    # endpoints:
    #   - id: ollama-local
    #     provider: ollama
    #     base-url: http://127.0.0.1:11434
    #     model: qwen3:8b
    #   - id: remote-openai
    #     provider: openai
    #     base-url: http://127.0.0.1:8088
    #     model: qwen
    #     api-key: ${LLM_REMOTE_API_KEY:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} - %msg trace=%X{traceId}%n"

# Actuator 指标导出（metrics + prometheus）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: llm-gateway

# ===================== RabbitMQ 异步队列（生产启用） =====================
# 启用条件：classpath 有 spring-boot-starter-amqp 且 spring.rabbitmq.host 不为空
# 开发/测试无 RabbitMQ 时自动 fallback InMemoryAsyncTaskProducer
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:llm}
    password: ${RABBITMQ_PASS:llmplatform}
    virtual-host: /
    connection-timeout: 10s
    listener:
      simple:
        ack-mode: manual
        prefetch: 10
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2
